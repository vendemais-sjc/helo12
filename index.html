<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Ótica Heloísa • Música Ambiente</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            background: linear-gradient(135deg, #0a0a0a, #1a1a2e);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
            position: fixed;
            width: 100%;
            height: 100%;
        }

        .container {
            width: 100%;
            max-width: 450px;
            padding: 20px;
            z-index: 10;
        }

        .card {
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(20px);
            border-radius: 40px;
            padding: 30px 25px;
            text-align: center;
            border: 1px solid rgba(37, 211, 102, 0.3);
            box-shadow: 0 0 40px rgba(37, 211, 102, 0.2);
        }

        .logo {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #25D366, #128C7E);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 2.5rem;
            box-shadow: 0 0 20px rgba(37, 211, 102, 0.5);
        }

        h1 {
            color: white;
            font-size: 1.5rem;
            margin-bottom: 5px;
        }

        .sub {
            color: rgba(255,255,255,0.6);
            font-size: 0.8rem;
            margin-bottom: 20px;
        }

        .status-badge {
            display: inline-block;
            padding: 6px 15px;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: bold;
            margin-bottom: 20px;
            background: rgba(37, 211, 102, 0.2);
            border-left: 3px solid #25D366;
            color: #25D366;
        }

        .track-name {
            color: white;
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 8px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-artist {
            color: rgba(255,255,255,0.5);
            font-size: 0.75rem;
            margin-bottom: 20px;
        }

        .progress-area {
            margin-bottom: 20px;
        }

        .progress-time {
            display: flex;
            justify-content: space-between;
            color: rgba(255,255,255,0.6);
            font-size: 0.7rem;
            margin-bottom: 5px;
        }

        .progress-bar {
            height: 4px;
            background: rgba(255,255,255,0.2);
            border-radius: 4px;
            cursor: pointer;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #25D366, #128C7E);
            border-radius: 4px;
            width: 0%;
        }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 25px;
            margin: 20px 0;
        }

        .ctrl-btn {
            background: rgba(255,255,255,0.1);
            border: none;
            color: white;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            font-size: 1.2rem;
            cursor: pointer;
            transition: 0.2s;
        }

        .ctrl-btn:active {
            transform: scale(0.95);
            background: #25D366;
            color: #000;
        }

        .play-btn {
            width: 65px;
            height: 65px;
            background: linear-gradient(135deg, #25D366, #128C7E);
            color: #000;
            font-size: 1.5rem;
            box-shadow: 0 0 15px rgba(37, 211, 102, 0.5);
        }

        .btn-ativar {
            background: linear-gradient(135deg, #25D366, #128C7E);
            border: none;
            color: white;
            padding: 15px 35px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 10px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }

        .visualizer {
            display: flex;
            justify-content: center;
            gap: 4px;
            margin: 15px 0;
        }

        .visualizer-bar {
            width: 4px;
            background: #25D366;
            border-radius: 2px;
            height: 4px;
            transition: height 0.05s ease;
        }

        .ad-toast {
            position: fixed;
            bottom: 30%;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #ff4444, #cc0000);
            color: white;
            padding: 12px 24px;
            border-radius: 50px;
            font-weight: bold;
            z-index: 1000;
            display: none;
            white-space: nowrap;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateX(-50%) translateY(20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.9);
            padding: 15px 25px;
            border-radius: 50px;
            color: #25D366;
            display: none;
            z-index: 1001;
        }

        .toque-info {
            position: fixed;
            bottom: 20px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 0.7rem;
            color: rgba(255,255,255,0.3);
        }

        button {
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <div class="logo">
            <i class="fas fa-glasses"></i>
        </div>
        <h1>Ótica Heloísa</h1>
        <div class="sub">Música Ambiente • Sistema Inteligente</div>
        
        <div>
            <span class="status-badge" id="statusBadge">
                <i class="fas fa-circle"></i> AGUARDANDO
            </span>
        </div>
        
        <div class="track-name" id="trackName">🎵 Clique no botão verde</div>
        <div class="track-artist" id="trackArtist">21 músicas carregadas</div>
        
        <div class="visualizer" id="visualizer">
            <div class="visualizer-bar"></div>
            <div class="visualizer-bar"></div>
            <div class="visualizer-bar"></div>
            <div class="visualizer-bar"></div>
            <div class="visualizer-bar"></div>
            <div class="visualizer-bar"></div>
        </div>
        
        <div class="progress-area">
            <div class="progress-time">
                <span id="currentTime">0:00</span>
                <span id="totalTime">0:00</span>
            </div>
            <div class="progress-bar" id="progressBar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </div>
        
        <div class="controls">
            <button class="ctrl-btn" id="prevBtn"><i class="fas fa-backward"></i></button>
            <button class="ctrl-btn play-btn" id="playPauseBtn"><i class="fas fa-play"></i></button>
            <button class="ctrl-btn" id="nextBtn"><i class="fas fa-forward"></i></button>
        </div>
        
        <button class="btn-ativar" id="ativarBtn">
            <i class="fas fa-headphones"></i> ATIVAR SISTEMA
        </button>
    </div>
    <div class="toque-info">
        <i class="fas fa-hand-pointer"></i> Toque duplo = play/pause | Deslize = trocar música
    </div>
</div>

<div class="ad-toast" id="adToast">
    <i class="fas fa-bullhorn"></i> <span id="adText">ANÚNCIO</span>
</div>
<div class="loading" id="loading">
    <i class="fas fa-circle-notch fa-spin"></i> Carregando...
</div>

<audio id="audioPlayer" preload="auto"></audio>

<script>
    // ==================== CONFIGURAÇÕES ====================
    let ativo = false;
    let tocando = false;
    let anuncioAtivo = false;
    let contadorMusicas = 0;
    let indiceAnuncio = 0;
    
    let intervaloProgresso = null;
    let intervaloVisualizer = null;
    
    const audio = document.getElementById('audioPlayer');
    const ativarBtn = document.getElementById('ativarBtn');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const progressBar = document.getElementById('progressBar');
    const progressFill = document.getElementById('progressFill');
    const currentTimeSpan = document.getElementById('currentTime');
    const totalTimeSpan = document.getElementById('totalTime');
    const trackNameSpan = document.getElementById('trackName');
    const trackArtistSpan = document.getElementById('trackArtist');
    const statusBadge = document.getElementById('statusBadge');
    const adToast = document.getElementById('adToast');
    const adTextSpan = document.getElementById('adText');
    const loadingDiv = document.getElementById('loading');
    const visualizerBars = document.querySelectorAll('.visualizer-bar');
    
    // ==================== TODAS AS SUAS 21 MÚSICAS ====================
    const MUSICAS = [
        { title: "Thiago Martins - Onde Deus Possa Me Ouvir", artist: "Thiago Martins", src: "Thiago_Martins_Onde_Deus_Possa_Me_Ouvir_Esperando_Avi_es_muzzik.m4a" },
        { title: "Leandro Sapucahy - Poxa / Disritmia", artist: "Leandro Sapucahy", src: "LEANDRO_SAPUCAHY_Poxa_Disritmia_Espelho_Que_Nem_Antigamente__muzzik.m4a" },
        { title: "Felipe Araújo e Thiaguinho - Espaçosa Demais", artist: "Felipe Araújo e Thiaguinho", src: "Felipe_Ara_jo_Thiaguinho_Espa_osa_Demais_muzzik.m4a" },
        { title: "Bokaloka - Duas paixões / Procurando alguém / Bye Bye", artist: "Bokaloka", src: "Bokaloka_Duas_paix_es_Procurando_algu_m_Bye_Bye_muzzik.m4a" },
        { title: "Péricles - Me Apaixonei pela Pessoa Errada", artist: "Péricles", src: "Live_P_ricles_Me_Apaixonei_Pela_Pessoa_Errada_muzzik.m4a" },
        { title: "Desse Jeito - Desse Jeito / Ruim pra Mim", artist: "Desse Jeito", src: "Desse_Jeito_Desse_Jeito_Ruim_pra_Mim_Ao_Vivo__muzzik.m4a" },
        { title: "Ferrugem - Telepatia (part. Thiaguinho)", artist: "Ferrugem", src: "Ferrugem_Telepatia_part_Thiaguinho_muzzik.m4a" },
        { title: "Délcio Luiz - Meu casamento / Refém do coração / Luz do desejo", artist: "Délcio Luiz", src: "D_lcio_Luiz_Meu_casamento_Ref_m_do_cora_o_Luz_do_desejo_muzzik.m4a" },
        { title: "Até Que - Até Que Durou (Ao Vivo)", artist: "Até Que", src: "At_Que_At_Que_Durou_Ao_Vivo__muzzik.m4a" },
        { title: "Ludmilla - Falta de Mim", artist: "Ludmilla", src: "LUDMILLA_Falta_de_Mim_muzzik.m4a" },
        { title: "Belo - Transas (Ao Vivo)", artist: "Belo", src: "Belo_Transas_Ao_Vivo_DVD_Belo_In_Concert_muzzik.m4a" },
        { title: "Ivete Sangalo - Ah, Como Eu Te Amei / Retalhos de Cetim / Ivete Clareou", artist: "Ivete Sangalo", src: "Ivete_Sangalo_Ah_Como_Eu_Te_Amei_Retalhos_de_Cetim_Ivete_Clareou_muzzik.m4a" },
        { title: "Mania - Mania de Você", artist: "Mania", src: "Mania_de_Mania_de_Voc__muzzik.m4a" },
        { title: "Xande de Pilares - Defunto / Caguete / Malandro Não Vacila", artist: "Xande de Pilares", src: "Xande_de_Pilares_Defunto_Caguete_Malandro_N_o_Vacila_muzzik.m4a" },
        { title: "Kiko - Nem de Graça / Falando Segredo / Brilho de Cristal", artist: "Kiko", src: "Kiko_Nem_de_Gra_a_Falando_Segredo_Brilho_de_Cristal_muzzik.m4a" },
        { title: "Marvvila e Ivete Sangalo - Você Não Vai Sofrer", artist: "Marvvila e Ivete Sangalo", src: "Marvvila_Ivete_Sangalo_Voc_N_o_Vai_Sofrer_muzzik.m4a" },
        { title: "Rolezinho - Rolezinho (Grupo)", artist: "Rolezinho", src: "Rolezinho_Rolezinho_Grupo_muzzik.m4a" },
        { title: "PaGGodin - L o Santana / Girassol / Uma Brasileira / Sombra Da Maldade", artist: "PaGGodin", src: "PaGGodin_L_o_Santana_Girassol_Uma_Brasileira_Sombra_Da_Maldade_muzzik.m4a" },
        { title: "Leandro Sapucahy - Naquela Mesa", artist: "Leandro Sapucahy", src: "Leandro_Sapucahy_Naquela_Mesa_muzzik.m4a" },
        { title: "Sorriso Maroto - Meu Jeito de Ser / Que Se Chama Amor", artist: "Sorriso Maroto", src: "Meu_Jeito_De_Ser_Que_Se_Chama_De_Amor_Sorriso_Maroto_muzzik.m4a" },
        { title: "Pra Não - Pra Não Pensar Em Você (Ao Vivo)", artist: "Pra Não", src: "Pra_N_o_Pra_N_o_Pensar_Em_Voc_Ao_Vivo__muzzik.m4a" }
    ];
    
    // ==================== 2 ANÚNCIOS ====================
    const ANUNCIOS = [
        { texto: "📢 Ótica Heloísa! Armações com até 50% de desconto! Venha conferir!", src: "anun1.mp3" },
        { texto: "📢 Promoção especial! Lentes com garantia de 1 ano! Não perca!", src: "anun2.mp3" }
    ];
    
    // ==================== UTILITÁRIOS ====================
    function mostrarLoading(show) {
        loadingDiv.style.display = show ? 'flex' : 'none';
    }
    
    function formatarTempo(seg) {
        if (isNaN(seg) || !isFinite(seg)) return '0:00';
        const m = Math.floor(seg / 60);
        const s = Math.floor(seg % 60);
        return `${m}:${s < 10 ? '0' : ''}${s}`;
    }
    
    function atualizarBadge() {
        if (anuncioAtivo) {
            statusBadge.innerHTML = '<i class="fas fa-bullhorn"></i> ANÚNCIO';
            statusBadge.style.borderLeftColor = '#ff4444';
            statusBadge.style.color = '#ff4444';
        } else {
            statusBadge.innerHTML = `<i class="fas fa-music"></i> MÚSICA ${contadorMusicas + 1}/2`;
            statusBadge.style.borderLeftColor = '#25D366';
            statusBadge.style.color = '#25D366';
        }
    }
    
    function iniciarProgresso() {
        if (intervaloProgresso) clearInterval(intervaloProgresso);
        intervaloProgresso = setInterval(() => {
            if (tocando && audio.duration && !audio.paused) {
                const percent = (audio.currentTime / audio.duration) * 100;
                progressFill.style.width = percent + '%';
                currentTimeSpan.textContent = formatarTempo(audio.currentTime);
                totalTimeSpan.textContent = formatarTempo(audio.duration);
            }
        }, 200);
    }
    
    function pararProgresso() {
        if (intervaloProgresso) {
            clearInterval(intervaloProgresso);
            intervaloProgresso = null;
        }
    }
    
    function iniciarVisualizer() {
        if (intervaloVisualizer) clearInterval(intervaloVisualizer);
        intervaloVisualizer = setInterval(() => {
            if (tocando && !audio.paused && audio.currentTime > 0) {
                visualizerBars.forEach(bar => {
                    const altura = 4 + Math.random() * 25;
                    bar.style.height = altura + 'px';
                });
            } else {
                visualizerBars.forEach(bar => bar.style.height = '4px');
            }
        }, 100);
    }
    
    function pararVisualizer() {
        if (intervaloVisualizer) {
            clearInterval(intervaloVisualizer);
            intervaloVisualizer = null;
        }
        visualizerBars.forEach(bar => bar.style.height = '4px');
    }
    
    function mostrarAnuncio(texto) {
        adTextSpan.textContent = texto;
        adToast.style.display = 'block';
        setTimeout(() => {
            adToast.style.display = 'none';
        }, 3000);
    }
    
    // ==================== TOCAR ANÚNCIO ====================
    function tocarAnuncio() {
        return new Promise((resolve) => {
            if (!ativo) return resolve();
            
            anuncioAtivo = true;
            tocando = false;
            playPauseBtn.innerHTML = '<i class="fas fa-play"></i>';
            pararProgresso();
            pararVisualizer();
            atualizarBadge();
            
            const anuncio = ANUNCIOS[indiceAnuncio % ANUNCIOS.length];
            indiceAnuncio++;
            
            mostrarAnuncio(anuncio.texto);
            console.log(`📢 ANÚNCIO: ${anuncio.texto}`);
            trackNameSpan.textContent = '📢 ANÚNCIO PUBLICITÁRIO';
            trackArtistSpan.textContent = 'Ótica Heloísa';
            
            if (anuncio.src) {
                const audioAd = new Audio(anuncio.src);
                audioAd.play().catch(e => console.log('Erro no anúncio:', e));
                audioAd.onended = () => {
                    audioAd.src = '';
                    resolve();
                };
                audioAd.onerror = () => {
                    setTimeout(resolve, 3000);
                };
            } else {
                setTimeout(resolve, 3000);
            }
        });
    }
    
    async function finalizarAnuncio() {
        anuncioAtivo = false;
        contadorMusicas = 0;
        console.log('✅ Anúncio finalizado! Iniciando 2 músicas...');
        atualizarBadge();
        await tocarMusicaAleatoria();
    }
    
    // ==================== TOCAR MÚSICA ====================
    async function tocarMusicaAleatoria() {
        if (!ativo || anuncioAtivo) return;
        
        const indice = Math.floor(Math.random() * MUSICAS.length);
        const musica = MUSICAS[indice];
        
        trackNameSpan.textContent = musica.title;
        trackArtistSpan.textContent = musica.artist;
        
        audio.src = musica.src;
        audio.load();
        
        audio.oncanplaythrough = () => {
            audio.play().then(() => {
                tocando = true;
                playPauseBtn.innerHTML = '<i class="fas fa-pause"></i>';
                iniciarProgresso();
                iniciarVisualizer();
                atualizarBadge();
                console.log(`🎵 Tocando música ${contadorMusicas + 1}/2: ${musica.title}`);
            }).catch(err => {
                console.log('Erro ao tocar:', err);
                setTimeout(() => tocarMusicaAleatoria(), 1000);
            });
        };
        
        audio.onerror = () => {
            console.log('Erro no arquivo, tentando outra...');
            setTimeout(() => tocarMusicaAleatoria(), 1000);
        };
    }
    
    // ==================== FIM DA MÚSICA ====================
    audio.onended = async () => {
        if (anuncioAtivo) return;
        
        if (ativo && tocando) {
            contadorMusicas++;
            console.log(`🎵 Música finalizada. Contador: ${contadorMusicas}/2`);
            
            if (contadorMusicas >= 2) {
                console.log('🔁 2 músicas tocadas! Iniciando anúncio...');
                await tocarAnuncio();
                await finalizarAnuncio();
            } else {
                console.log('🎵 Tocando próxima música...');
                await tocarMusicaAleatoria();
            }
        }
    };
    
    // ==================== CONTROLES ====================
    function pausarMusica() {
        if (audio.src && !audio.paused) {
            audio.pause();
            tocando = false;
            playPauseBtn.innerHTML = '<i class="fas fa-play"></i>';
            pararProgresso();
            pararVisualizer();
        }
    }
    
    function alternarPlayPause() {
        if (!ativo) {
            console.log('⚠️ Ative o sistema primeiro!');
            return;
        }
        if (anuncioAtivo) {
            console.log('⚠️ Anúncio em execução');
            return;
        }
        if (tocando) {
            pausarMusica();
        } else {
            if (audio.src && audio.src !== '') {
                audio.play().then(() => {
                    tocando = true;
                    playPauseBtn.innerHTML = '<i class="fas fa-pause"></i>';
                    iniciarProgresso();
                    iniciarVisualizer();
                }).catch(() => tocarMusicaAleatoria());
            } else {
                tocarMusicaAleatoria();
            }
        }
    }
    
    function proximaMusica() {
        if (!ativo || anuncioAtivo) return;
        pausarMusica();
        tocarMusicaAleatoria();
    }
    
    function musicaAnterior() {
        proximaMusica();
    }
    
    // ==================== ATIVAR SISTEMA ====================
    async function ativarSistema() {
        if (ativo) return;
        
        mostrarLoading(true);
        
        try {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (AudioContext) {
                const ctx = new AudioContext();
                await ctx.resume();
                ctx.close();
            }
            
            ativo = true;
            ativarBtn.style.display = 'none';
            
            console.log('✅ Sistema ativado!');
            console.log('📋 LÓGICA: ANÚNCIO → 2 MÚSICAS → ANÚNCIO → 2 MÚSICAS...');
            
            contadorMusicas = 0;
            indiceAnuncio = 0;
            
            await tocarAnuncio();
            await finalizarAnuncio();
            
        } catch (err) {
            console.error('Erro:', err);
            ativo = false;
            ativarBtn.style.display = 'block';
        } finally {
            mostrarLoading(false);
        }
    }
    
    // ==================== EVENTOS ====================
    ativarBtn.addEventListener('click', ativarSistema);
    playPauseBtn.addEventListener('click', alternarPlayPause);
    nextBtn.addEventListener('click', proximaMusica);
    prevBtn.addEventListener('click', musicaAnterior);
    
    progressBar.addEventListener('click', (e) => {
        if (audio.duration && !anuncioAtivo && tocando) {
            const rect = e.currentTarget.getBoundingClientRect();
            const percent = (e.clientX - rect.left) / rect.width;
            audio.currentTime = percent * audio.duration;
        }
    });
    
    // Gestos de toque
    let touchStartX = 0;
    let lastTap = 0;
    
    document.addEventListener('touchstart', (e) => {
        touchStartX = e.changedTouches[0].screenX;
        const now = Date.now();
        if (now - lastTap < 300) {
            e.preventDefault();
            alternarPlayPause();
        }
        lastTap = now;
    });
    
    document.addEventListener('touchend', (e) => {
        const diff = e.changedTouches[0].screenX - touchStartX;
        if (Math.abs(diff) > 50 && ativo && !anuncioAtivo) {
            if (diff > 0) musicaAnterior();
            else proximaMusica();
        }
    });
    
    console.log('✅ Sistema carregado! 21 músicas prontas.');
    console.log('📁 Clique no botão VERDE para começar');
</script>
</body>
</html>

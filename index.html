<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Rádio Patico IA - Futurista</title>
    <link rel="icon" type="image/png" href="falcon.png">
    <link rel="shortcut icon" href="favicon.ico">
    <link rel="apple-touch-icon" href="falcon.png">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0a0f;
            --bg-glass: rgba(10, 10, 15, 0.7);
            --blur: 16px;
            --accent: #00f3ff;
            --accent-glow: rgba(0, 243, 255, 0.6);
            --secondary: #ff2d7f;
            --text: #fff;
            --border-glow: 0 0 8px rgba(0, 243, 255, 0.5);
            --grad-cyber: linear-gradient(135deg, #00f3ff, #ff2d7f);
        }

        body {
            min-height: 100vh;
            background: var(--bg-primary);
            overflow: hidden;
            position: fixed;
            width: 100%;
            height: 100%;
            font-family: 'Rajdhani', sans-serif;
        }

        /* ===== SPLASH FUTURISTA ===== */
        #splash {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 30%, #0a0a0f, #000000);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.8s cubic-bezier(0.2, 0.9, 0.4, 1.1), visibility 0.8s;
            overflow: hidden;
        }
        #splash::before {
            content: "";
            position: absolute;
            width: 200%;
            height: 200%;
            background-image: linear-gradient(rgba(0, 243, 255, 0.1) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 243, 255, 0.1) 1px, transparent 1px);
            background-size: 40px 40px;
            animation: gridMove 20s linear infinite;
            pointer-events: none;
        }
        @keyframes gridMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(40px, 40px); }
        }
        .splash-content {
            text-align: center;
            z-index: 2;
            animation: fadeInUp 1s ease-out;
        }
        .splash-content i {
            font-size: 6rem;
            background: linear-gradient(135deg, #00f3ff, #ff2d7f);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 30px rgba(0, 243, 255, 0.5);
            animation: pulseGlow 1.8s infinite;
            margin-bottom: 1rem;
        }
        .splash-content h1 {
            font-family: 'Orbitron', monospace;
            font-size: 2.5rem;
            letter-spacing: 4px;
            background: linear-gradient(135deg, #fff, #00f3ff, #ff2d7f);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 20px rgba(0, 243, 255, 0.3);
            margin-bottom: 8px;
            animation: glitch 3s infinite;
        }
        .splash-content p {
            font-family: 'Rajdhani', sans-serif;
            font-size: 1rem;
            letter-spacing: 2px;
            color: #00f3ff;
            text-transform: uppercase;
            font-weight: 500;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes pulseGlow {
            0% { text-shadow: 0 0 0px rgba(0, 243, 255, 0); transform: scale(1); }
            50% { text-shadow: 0 0 30px rgba(0, 243, 255, 0.8); transform: scale(1.05); }
            100% { text-shadow: 0 0 0px rgba(0, 243, 255, 0); transform: scale(1); }
        }
        @keyframes glitch {
            0%, 100% { text-shadow: 2px 0 #ff2d7f, -2px 0 #00f3ff; }
            25% { text-shadow: -2px 0 #ff2d7f, 2px 0 #00f3ff; }
            50% { text-shadow: 2px 2px #ff2d7f, -2px -2px #00f3ff; }
            75% { text-shadow: -2px -2px #ff2d7f, 2px 2px #00f3ff; }
        }
        #splash.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        /* ===== APP PRINCIPAL ===== */
        .app {
            width: 100%;
            height: 100vh;
            position: relative;
            overflow: hidden;
        }

        .fullscreen-video-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 1;
        }
        .fullscreen-video-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .bottom-controls {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(0, 243, 255, 0.3);
            padding: 12px 20px 20px;
            z-index: 20;
            transition: transform 0.3s ease;
            border-radius: 24px 24px 0 0;
            box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.5);
        }
        .bottom-controls.hide {
            transform: translateY(100%);
        }

        .track-info {
            text-align: center;
            margin-bottom: 8px;
        }
        .marquee-wrap {
            width: 100%;
            overflow: hidden;
            white-space: nowrap;
        }
        .marquee-text {
            display: inline-block;
            animation: marquee 30s linear infinite;
            color: #00f3ff;
            font-weight: 700;
            font-size: 1.2rem;
            letter-spacing: 1px;
            text-shadow: 0 0 5px rgba(0,243,255,0.5);
        }
        .next-track {
            text-align: center;
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 6px;
        }
        .progress-area {
            margin-bottom: 12px;
        }
        .progress-time {
            display: flex;
            justify-content: space-between;
            font-size: 0.7rem;
            color: #aaa;
        }
        .progress-bar {
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            cursor: pointer;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #00f3ff, #ff2d7f);
            width: 0%;
            border-radius: 4px;
        }
        .control-buttons {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }
        .control-btn {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(0, 243, 255, 0.5);
            color: #00f3ff;
            font-size: 1.2rem;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .control-btn:active {
            transform: scale(0.92);
            background: #00f3ff;
            color: #000;
            box-shadow: 0 0 15px #00f3ff;
        }
        .play-btn {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #00f3ff, #ff2d7f);
            color: #000;
            border: none;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.6);
        }
        .genre-badge {
            position: absolute;
            top: 16px;
            left: 16px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(12px);
            padding: 6px 16px;
            border-radius: 40px;
            font-size: 0.7rem;
            font-weight: bold;
            color: #00f3ff;
            z-index: 31;
            border-left: 3px solid #00f3ff;
            font-family: 'Orbitron', monospace;
            letter-spacing: 1px;
        }
        .menu-button {
            position: absolute;
            top: 16px;
            right: 16px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            color: #00f3ff;
            border: 1px solid #00f3ff;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            cursor: pointer;
            z-index: 31;
            transition: 0.2s;
        }
        .menu-button:active {
            transform: scale(0.95);
        }
        .feedback-btn {
            position: fixed;
            bottom: 180px;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            backdrop-filter: blur(8px);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            transition: 0.1s;
            z-index: 27;
            border: 2px solid;
            background: rgba(0, 0, 0, 0.7);
        }
        .feedback-btn:active {
            transform: scale(0.9);
        }
        .feedback-btn.like {
            left: 16px;
            color: #4ade80;
            border-color: #4ade80;
            box-shadow: 0 0 8px #4ade80;
        }
        .feedback-btn.dislike {
            left: 76px;
            color: #ef4444;
            border-color: #ef4444;
            box-shadow: 0 0 8px #ef4444;
        }
        .menu-popup {
            position: absolute;
            top: 70px;
            right: 16px;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(16px);
            border-radius: 20px;
            padding: 10px;
            z-index: 32;
            display: none;
            flex-direction: column;
            gap: 8px;
            border: 1px solid #00f3ff;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.3);
        }
        .menu-popup.open {
            display: flex;
        }
        .menu-popup button {
            background: rgba(255, 255, 255, 0.05);
            border: none;
            color: white;
            padding: 10px 20px;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: 0.2s;
            font-family: 'Rajdhani', sans-serif;
        }
        .visualizer {
            position: fixed;
            top: 80px;
            right: 20px;
            display: flex;
            gap: 4px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            padding: 6px 12px;
            border-radius: 40px;
            z-index: 31;
        }
        .visualizer-bar {
            width: 4px;
            height: 18px;
            background: #00f3ff;
            border-radius: 2px;
            transition: height 0.05s ease;
        }
        .loading-spinner {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(12px);
            padding: 12px 24px;
            border-radius: 60px;
            z-index: 10001;
            display: none;
            gap: 12px;
            color: #00f3ff;
            font-weight: bold;
            border: 1px solid #00f3ff;
        }
        .loading-spinner.show {
            display: flex;
        }
        .notification-top {
            position: absolute;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(12px);
            padding: 6px 18px;
            border-radius: 50px;
            color: #00f3ff;
            font-size: 0.8rem;
            z-index: 30;
            opacity: 0;
            transition: 0.2s;
            pointer-events: none;
            white-space: nowrap;
            border-left: 3px solid #00f3ff;
        }
        .notification-top.show {
            opacity: 1;
        }
        .exit-tv-btn {
            position: fixed;
            top: 16px;
            left: 16px;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            padding: 8px 16px;
            border-radius: 40px;
            font-size: 0.7rem;
            font-weight: bold;
            color: #fff;
            border: 1px solid #ff2d7f;
            z-index: 102;
            display: none;
            cursor: pointer;
        }
        .tv-mode-active .exit-tv-btn {
            display: block;
        }
        .ad-toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(135deg, #ff2d7f, #00f3ff);
            color: white;
            padding: 15px 25px;
            border-radius: 60px;
            z-index: 150;
            display: none;
            align-items: center;
            gap: 12px;
            font-weight: bold;
            animation: slideUp 0.3s ease;
            text-align: center;
            max-width: 85%;
            font-size: 0.9rem;
            font-family: 'Orbitron', monospace;
        }
        .ad-toast.show {
            display: flex;
        }
        @keyframes slideUp {
            from {
                transform: translate(-50%, -50%) translateY(20px);
                opacity: 0;
            }
            to {
                transform: translate(-50%, -50%) translateY(0);
                opacity: 1;
            }
        }
        @keyframes marquee {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }
        #tap-to-start {
            position: fixed;
            bottom: 20%;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #00f3ff, #ff2d7f);
            color: #000;
            padding: 12px 24px;
            border-radius: 50px;
            font-weight: bold;
            font-family: 'Orbitron', monospace;
            z-index: 10000;
            cursor: pointer;
            display: none;
            box-shadow: 0 0 20px #00f3ff;
            white-space: nowrap;
            border: none;
        }
        #tap-to-start:active {
            transform: translateX(-50%) scale(0.96);
        }
    </style>
</head>

    const adToastText = document.getElementById('adToastText');
    
    // ==================== UTILITÁRIOS ====================
    function mostrarNotificacao(msg, dur = 2500) {
        notificationTop.textContent = msg;
        notificationTop.classList.add('show');
        setTimeout(() => notificationTop.classList.remove('show'), dur);
    }
    
    function formatTime(seconds) {
        if (isNaN(seconds) || !isFinite(seconds)) return "0:00";
        const mins = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60);
        return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }
    
    function updateStatus() {
        if (isAdPlaying) {
            genreBadge.innerHTML = '<i class="fas fa-bullhorn"></i> ANÚNCIO';
            genreBadge.style.borderLeftColor = "#ff2d7f";
        } else {
            genreBadge.innerHTML = `<i class="fas fa-music"></i> MÚSICA ${musicCount + 1}/2`;
            genreBadge.style.borderLeftColor = "#00f3ff";
        }
    }
    
    function startProgressTimer() {
        if (progressInterval) clearInterval(progressInterval);
        progressInterval = setInterval(() => {
            if (isPlaying && audio.src && !audio.paused && audio.duration) {
                const percent = (audio.currentTime / audio.duration) * 100;
                progressFill.style.width = percent + '%';
                currentTimeEl.textContent = formatTime(audio.currentTime);
                totalTimeEl.textContent = formatTime(audio.duration);
            }
        }, 200);
    }
    
    function stopProgressTimer() {
        if (progressInterval) {
            clearInterval(progressInterval);
            progressInterval = null;
        }
    }
    
    function startVisualizer() {
        if (visualizerInterval) clearInterval(visualizerInterval);
        visualizerInterval = setInterval(() => {
            if (isPlaying && !audio.paused && audio.currentTime > 0) {
                visualizerBars.forEach(bar => {
                    const height = 8 + Math.random() * 32;
                    bar.style.height = height + 'px';
                });
            } else {
                visualizerBars.forEach(bar => bar.style.height = '4px');
            }
        }, 100);
    }
    
    function stopVisualizer() {
        if (visualizerInterval) {
            clearInterval(visualizerInterval);
            visualizerInterval = null;
        }
        visualizerBars.forEach(bar => bar.style.height = '4px');
    }
    
    function updateTrackInfo(track) {
        if (!track) return;
        trackMarquee.innerHTML = `<span class="marquee-text">🎵 ${track.title} - ${track.genero}</span>`;
        
        // Próxima música
        const currentIdx = SONGS.findIndex(s => s.title === track.title);
        const nextIdx = (currentIdx + 1) % SONGS.length;
        const nextTrack = SONGS[nextIdx];
        nextTrackInfo.textContent = nextTrack ? `Próxima: ${nextTrack.title.substring(0, 40)}...` : 'Próxima: --';
    }
    
    function shuffleArray(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }
    
    // ==================== TOCAR MÚSICA ====================
    function playRandomMusic() {
        if (!isActive || isAdPlaying) return;
        
        const randomIndex = Math.floor(Math.random() * SONGS.length);
        currentSongIndex = randomIndex;
        const song = SONGS[currentSongIndex];
        
        updateTrackInfo(song);
        
        audio.src = song.src;
        audio.load();
        
        audio.oncanplaythrough = () => {
            audio.play().then(() => {
                isPlaying = true;
                playPauseBtn.innerHTML = '<i class="fas fa-pause"></i>';
                startProgressTimer();
                startVisualizer();
                updateStatus();
                console.log(`🎵 Tocando música ${musicCount + 1}/2: ${song.title}`);
            }).catch(err => {
                console.log("Erro ao tocar música:", err);
                setTimeout(() => playRandomMusic(), 1000);
            });
        };
        
        audio.onerror = () => {
            console.log("Erro no arquivo de música, tentando outra...");
            setTimeout(() => playRandomMusic(), 1000);
        };
    }
    
    // ==================== TOCAR ANÚNCIO ====================
    function playAd() {
        if (!isActive) return;
        
        isAdPlaying = true;
        isPlaying = false;
        
        stopVisualizer();
        stopProgressTimer();
        
        const ad = ADS[adIndex % ADS.length];
        adIndex++;
        
        adToastText.innerHTML = `<i class="fas fa-bullhorn"></i> ${ad.text}`;
        adToast.classList.add('show');
        
        console.log(`📢 Tocando ANÚNCIO: ${ad.text}`);
        updateStatus();
        
        audio.src = ad.src;
        audio.load();
        
        audio.oncanplaythrough = () => {
            audio.play().catch(err => {
                console.log("Erro ao tocar anúncio:", err);
                skipAd();
            });
        };
        
        audio.onended = () => {
            console.log("✅ ANÚNCIO finalizado! Iniciando 2 músicas...");
            finishAd();
        };
        
        audio.onerror = () => {
            console.log("Erro no anúncio, pulando...");
            skipAd();
        };
    }
    
    function skipAd() {
        isAdPlaying = false;
        adToast.classList.remove('show');
        musicCount = 0;
        playRandomMusic();
        updateStatus();
    }
    
    function finishAd() {
        isAdPlaying = false;
        adToast.classList.remove('show');
        musicCount = 0;
        playRandomMusic();
        updateStatus();
    }
    
    // ==================== FIM DA MÚSICA (LÓGICA CORRETA) ====================
    audio.onended = () => {
        if (isAdPlaying) return;
        
        if (isActive && isPlaying) {
            musicCount++; // 0->1 (1ª música), 1->2 (2ª música)
            console.log(`🎵 Música finalizada. musicCount = ${musicCount}`);
            updateStatus();
            
            if (musicCount >= 2) {
                console.log("🔁🔁🔁 2 MÚSICAS TOCADAS! INICIANDO ANÚNCIO...");
                playAd();
            } else {
                console.log("🎵 Tocando PRÓXIMA música...");
                playRandomMusic();
            }
        }
    };
    
    // ==================== CONTROLES ====================
    function pauseMusic() {
        if (audio.src && !audio.paused) {
            audio.pause();
            isPlaying = false;
            playPauseBtn.innerHTML = '<i class="fas fa-play"></i>';
            stopProgressTimer();
            stopVisualizer();
        }
    }
    
    function togglePlayPause() {
        if (!isActive) {
            mostrarNotificacao("Clique em ATIVAR RÁDIO primeiro!", 2000);
            return;
        }
        
        if (isAdPlaying) {
            mostrarNotificacao("Anúncio em execução, aguarde...", 1500);
            return;
        }
        
        if (isPlaying) {
            pauseMusic();
        } else {
            if (audio.src && audio.src !== "") {
                audio.play().then(() => {
                    isPlaying = true;
                    playPauseBtn.innerHTML = '<i class="fas fa-pause"></i>';
                    startProgressTimer();
                    startVisualizer();
                }).catch(() => playRandomMusic());
            } else {
                playRandomMusic();
            }
        }
    }
    
    function nextTrack() {
        if (!isActive || isAdPlaying || isLoading) return;
        pauseMusic();
        playRandomMusic();
    }
    
    function prevTrack() {
        nextTrack();
    }
    
    // ==================== TELA CHEIA ====================
    function enterFullscreen() {
        const docEl = document.documentElement;
        if (docEl.requestFullscreen) {
            docEl.requestFullscreen();
        } else if (docEl.webkitRequestFullscreen) {
            docEl.webkitRequestFullscreen();
        }
    }
    
    // ==================== MODO TV ====================
    function toggleTvMode() {
        const app = document.querySelector('.app');
        if (!isTvMode) {
            isTvMode = true;
            app.classList.add('tv-mode-active');
            document.getElementById('exitTvBtn').style.display = 'block';
            mainVideo.src = "modop.mp4";
            mainVideo.load();
            mainVideo.play().catch(() => {});
            mostrarNotificacao('📺 Modo TV ativado', 2000);
        } else {
            isTvMode = false;
            app.classList.remove('tv-mode-active');
            document.getElementById('exitTvBtn').style.display = 'none';
            mainVideo.src = "pai101.mp4";
            mainVideo.load();
            mainVideo.play().catch(() => {});
            mostrarNotificacao('Modo TV desativado', 1500);
        }
    }
    
    // ==================== ÁUDIO BACKGROUND ====================
    async function createSilentAudio() {
        const sampleRate = 44100, duration = 5, numSamples = sampleRate * duration;
        const buffer = new ArrayBuffer(44 + numSamples * 2);
        const view = new DataView(buffer);
        const writeString = (v, o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
        writeString(view, 0, 'RIFF');
        view.setUint32(4, 36 + numSamples * 2, true);
        writeString(view, 8, 'WAVE');
        writeString(view, 12, 'fmt ');
        view.setUint32(16, 16, true);
        view.setUint16(20, 1, true);
        view.setUint16(22, 1, true);
        view.setUint32(24, sampleRate, true);
        view.setUint32(28, sampleRate * 2, true);
        view.setUint16(32, 2, true);
        view.setUint16(34, 16, true);
        writeString(view, 36, 'data');
        view.setUint32(40, numSamples * 2, true);
        return new Blob([buffer], { type: 'audio/wav' });
    }
    
    async function ativarAudioBackground() {
        try {
            const silentUrl = URL.createObjectURL(await createSilentAudio());
            bgAudio.src = silentUrl;
            bgAudio.loop = true;
            bgAudio.volume = 0.001;
            await bgAudio.play();
            return true;
        } catch (e) {
            return false;
        }
    }
    
    // ==================== INICIAR SISTEMA ====================
    async function startSystem() {
        if (isActive) return;
        
        loadingSpinner.classList.add('show');
        
        try {
            const ok = await ativarAudioBackground();
            if (!ok) throw new Error("Erro ao ativar áudio");
            
            isActive = true;
            tapToStart.style.display = 'none';
            
            enterFullscreen();
            
            mostrarNotificacao("🎬 INICIANDO: ANÚNCIO → 2 MÚSICAS → ANÚNCIO...", 4000);
            
            musicCount = 0;
            adIndex = 0;
            playAd(); // Começa com anúncio
            
            splash.classList.add('hidden');
            setTimeout(() => splash.style.display = 'none', 500);
            
        } catch (err) {
            console.error("Erro:", err);
            mostrarNotificacao("Erro ao ativar. Toque novamente.", 3000);
        } finally {
            loadingSpinner.classList.remove('show');
        }
    }
    
    // ==================== EVENTOS ====================
    tapToStart.addEventListener('click', startSystem);
    playPauseBtn.addEventListener('click', togglePlayPause);
    prevBtn.addEventListener('click', prevTrack);
    nextBtn.addEventListener('click', nextTrack);
    
    progressBar.addEventListener('click', (e) => {
        if (audio.duration && !isAdPlaying && isPlaying) {
            const rect = e.currentTarget.getBoundingClientRect();
            const percent = (e.clientX - rect.left) / rect.width;
            audio.currentTime = percent * audio.duration;
        }
    });
    
    document.getElementById('fullscreenMenuBtn').addEventListener('click', () => {
        enterFullscreen();
        document.getElementById('menuPopup').classList.remove('open');
    });
    
    document.getElementById('shareMenuBtn').addEventListener('click', () => {
        if (navigator.share) {
            navigator.share({ title: 'Rádio Patico IA', url: location.href });
        } else {
            navigator.clipboard.writeText(location.href);
            mostrarNotificacao('Link copiado!', 1500);
        }
        document.getElementById('menuPopup').classList.remove('open');
    });
    
    document.getElementById('tvModeMenuBtn').addEventListener('click', () => {
        toggleTvMode();
        document.getElementById('menuPopup').classList.remove('open');
    });
    
    document.getElementById('exitTvBtn').addEventListener('click', () => {
        toggleTvMode();
    });
    
    document.getElementById('menuButton').addEventListener('click', (e) => {
        e.stopPropagation();
        document.getElementById('menuPopup').classList.toggle('open');
    });
    
    document.addEventListener('click', (e) => {
        const menuPopup = document.getElementById('menuPopup');
        const menuBtn = document.getElementById('menuButton');
        if (!menuBtn.contains(e.target) && !menuPopup.contains(e.target)) {
            menuPopup.classList.remove('open');
        }
    });
    
    // Auto-hide controls
    let autoHideTimer = null;
    document.addEventListener('touchstart', (e) => {
        if (!e.target.closest('.control-btn')) {
            bottomControls.classList.toggle('hide');
            if (!bottomControls.classList.contains('hide')) {
                if (autoHideTimer) clearTimeout(autoHideTimer);
                autoHideTimer = setTimeout(() => {
                    if (isPlaying || isAdPlaying) {
                        bottomControls.classList.add('hide');
                    }
                }, 4000);
            }
        }
    });
    
    // Gestos: deslizar para trocar música
    let touchStartX = 0;
    let lastTap = 0;
    
    document.addEventListener('touchstart', (e) => {
        touchStartX = e.changedTouches[0].screenX;
        const now = Date.now();
        if (now - lastTap < 300) {
            e.preventDefault();
            togglePlayPause();
        }
        lastTap = now;
    });
    
    document.addEventListener('touchend', (e) => {
        const diff = e.changedTouches[0].screenX - touchStartX;
        if (Math.abs(diff) > 50 && isActive && !isAdPlaying) {
            if (diff > 0) prevTrack();
            else nextTrack();
        }
    });
    
    tapToStart.style.display = 'block';
    console.log("✅ SISTEMA PRONTO - LÓGICA: ANÚNCIO → 2 MÚSICAS → ANÚNCIO → 2 MÚSICAS...");
</script>
